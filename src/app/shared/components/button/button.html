<button
  [class]="classes()"
  [disabled]="disabled()"
  [tabIndex]="tabindex()"
  (click)="clicked.emit($event)"
  [appOverlay]="menuOptions()?.length && buttonMenu ? buttonMenu : undefined"
  overlayWidth="fit-content"
  overlayHeight="auto"
  orientation="start"
>
  <ng-content></ng-content>
</button>

<ng-template #buttonMenu>
  <app-menu [menuOptions]="menuOptions() ?? []" [placeholder]="menuPlaceholder()"></app-menu>
</ng-template>
