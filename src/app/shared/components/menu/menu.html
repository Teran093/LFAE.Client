<div
  class="flex flex-col bg-surface overflow-hidden rounded border border-zinc-200 divide-y divide-zinc-200"
>
  @for (option of menuOptions(); track option) {
    <button
      class="px-4 py-2 cursor-pointer hover:bg-primary/20"
      [disabled]="option.disabled ?? false"
      (click)="onOptionClick(option)"
      (pointerenter)="onPointerEnter(option)"
      [appOverlay]="option.children?.length ? optionMenu : undefined"
      overlayWidth="fit-content"
      overlayHeight="auto"
      position="end"
      [overlayOffset]="4"
      [enabledOnHover]="true"
    >
      {{ option.label }}
    </button>
  }
</div>

<ng-template #optionMenu>
  <app-menu [menuOptions]="activeChildOptions()!" (selected)="selected.emit($event)"></app-menu>
</ng-template>
