<button
  type="button"
  [appOverlay]="selectMenu"
  orientation="start"
  [class]="classes()"
  [disabled]="disabled()"
  [overlayOffset]="menuOffset()"
>
  {{ currentOption()?.label() ?? placeholder() }}
</button>

<ng-template #selectMenu>
  <div [class]="menuClasses()">
    <ng-content></ng-content>
  </div>
</ng-template>
