<button
  type="button"
  role="checkbox"
  [class]="classes()"
  [attr.aria-checked]="checked()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  @if (checked()) {
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" class="size-3/4">
      <path d="M3 8.5l3.2 3.2L13 4.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
</button>
