<div class="flex w-full overflow-y-auto p-4 gap-4">
  <!-- Languages list -->
  <section
    class="flex basis-2xs flex-col p-2 shadow-sm rounded-xl bg-white border border-zinc-200 gap-5"
  >
    <h2>Languages</h2>
    <div class="flex flex-col gap-3">
      @if (languages.isLoading()) {
        <div>
          <p>Loading languages...</p>
        </div>
      } @else if (languages.error()) {
        <div class="flex p-2 border-l-4 bg-danger-soft border-danger">
          <p>Languages couldn't be loaded</p>
        </div>
        <app-button (clicked)="languages.reload()">Retry</app-button>
      } @else {
        <app-select
          [value]="selectedLangCode()"
          (valueChange)="selectedLangCode.set($event)"
          placeholder="Select a language"
          display="inline-flex"
          rounded="medium"
          class="w-full"
        >
          @for (language of languages.value(); track language.code) {
            <app-select-option
              [value]="language.code"
              [label]="language.name"
              [icon]="langIcons[language.code] ?? 'phosphorEmpty'"
              [iconSize]="24"
            ></app-select-option>
          }
        </app-select>

        @if (draft(); as draft) {
          <div class="flex flex-col gap-3">
            <h3>Config</h3>

            <div class="flex gap-3 items-center">
              <!-- The <label> gives each checkbox its accessible name, and clicking the text toggles it -->
              <label class="flex gap-2 items-center">
                <span>Active:</span>
                <app-checkbox
                  [checked]="draft.active"
                  (checkedChange)="setDraft('active', $event)"
                ></app-checkbox>
              </label>
              <label class="flex gap-2 items-center">
                <span>Default:</span>
                <app-checkbox
                  [checked]="draft.isDefault"
                  (checkedChange)="setDraft('isDefault', $event)"
                ></app-checkbox>
              </label>
            </div>
          </div>
          <div class="flex gap-2">
            <app-button
              [outline]="true"
              [disabled]="!hasChanges() || isSaving()"
              (clicked)="reset()"
              class="grow h-full"
              >Reset</app-button
            >
            <app-button
              [disabled]="!hasChanges() || isSaving()"
              (clicked)="save()"
              class="grow h-full"
              >Save</app-button
            >
          </div>
        }
      }
    </div>
  </section>
</div>
