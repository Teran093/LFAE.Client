<div class="flex flex-col gap-4 p-8">
  <div>
    <h1>Demo Page</h1>
    <p>This is a simple demo page for testing components and features.</p>
  </div>

  <div class="flex w-full flex-col gap-3">
    <!-- Options that apply to every component below -->
    <div class="flex w-fit items-center gap-2">
      <app-button size="medium" (clicked)="disable.set(!disable())"> Disable </app-button>
      <app-button [outline]="true" size="medium" (clicked)="outline.set(!outline())">
        Outlines
      </app-button>

      <!-- Fixed width so the button does not change size when the label changes -->
      <app-select class="block w-36" [(value)]="size">
        <app-select-option label="Small" value="small"></app-select-option>
        <app-select-option label="Medium" value="medium"></app-select-option>
        <app-select-option label="Large" value="large"></app-select-option>
      </app-select>

      <app-select class="block w-36" [(value)]="variant">
        <app-select-option label="Primary" value="primary"></app-select-option>
        <app-select-option label="Secondary" value="secondary"></app-select-option>
        <app-select-option label="Tertiary" value="tertiary"></app-select-option>
        <app-select-option label="Surface" value="surface"></app-select-option>
      </app-select>
    </div>

    <h2 class="text-xl font-bold">Button Components</h2>

    <div
      class="flex w-fit items-center gap-2 py-2"
      [class]="outline() ? 'bg-primary/25 -ml-2 px-2' : ''"
    >
      <app-button
        [variant]="variant()"
        [disabled]="disable()"
        [outline]="outline()"
        [size]="size()"
        class="w-36"
      >
        {{ variant() }}
      </app-button>
    </div>

    <h2 class="text-xl font-bold">Select Components</h2>

    <div
      class="flex w-fit items-center gap-2 py-2"
      [class]="outline() ? 'bg-primary/25 -ml-2 px-2' : ''"
    >
      <app-select
        class="block w-44"
        placeholder="Choose a place"
        [(value)]="place"
        [variant]="variant()"
        [disabled]="disable()"
        [outline]="outline()"
        [size]="size()"
      >
        <app-select-option label="Home" value="home" icon="lucideHome"></app-select-option>
        <app-select-option label="Keys" value="keys" icon="lucideKey"></app-select-option>
        <app-select-option label="Search" value="search" icon="tablerSearch"></app-select-option>
        <app-select-option
          label="Disabled"
          value="closed"
          icon="phosphorEmpty"
          [disabled]="true"
        ></app-select-option>
      </app-select>
    </div>

    <h2 class="text-xl font-bold">Checkbox Components</h2>

    <div
      class="flex w-fit items-center gap-2 py-2"
      [class]="outline() ? 'bg-primary/25 -ml-2 px-2' : ''"
    >
      <app-checkbox
        [variant]="variant()"
        [(checked)]="checkboxValue"
        [disabled]="disable()"
        [outline]="outline()"
        [size]="size()"
      ></app-checkbox>
    </div>
  </div>
</div>
