<div class="flex flex-col p-8 gap-4">
  <div>
    <h1>Demo Page</h1>
    <p>This is a simple demo page for testing components and features.</p>
  </div>
  <!-- BUTTONS DEMO -->
  <div
    [ngClass]="{
      'flex w-full flex-col gap-3': true,
    }"
  >
    <!-- Btn options -->
    <div class="gap-2 flex items-center w-fit">
      <app-button size="medium" display="inline-flex" (clicked)="disable.set(!disable())"
        >Disable</app-button
      >
      <app-button
        [outline]="true"
        size="medium"
        display="inline-flex"
        (clicked)="outline.set(!outline())"
        >Outlines</app-button
      >

      <app-select [(value)]="size">
        <app-select-option label="Small" value="small"></app-select-option>
        <app-select-option label="Medium" value="medium"></app-select-option>
        <app-select-option label="Large" value="large"></app-select-option>
      </app-select>

      <app-select [(value)]="variant">
        <app-select-option label="Primary" value="primary"></app-select-option>
        <app-select-option label="Secondary" value="secondary"></app-select-option>
        <app-select-option label="Tertiary" value="tertiary"></app-select-option>
        <app-select-option label="Surface" value="surface"></app-select-option>
      </app-select>
    </div>

    <h2 class="text-xl font-bold">Button Components</h2>

    <div
      [ngClass]="{
        'flex w-fit py-2 gap-2 items-center': true,
        'bg-primary/25 px-2 -ml-2': outline(),
      }"
    >
      <app-button
        [variant]="variant()"
        [disabled]="disable()"
        [outline]="outline()"
        [size]="size()"
        display="inline-flex"
        >{{ variant().toString() }}</app-button
      >
    </div>

    <h2 class="text-xl font-bold">Checkbox Components</h2>

    <div
      [ngClass]="{
        'flex w-fit py-2 gap-2 items-center': true,
        'bg-primary/25 px-2 -ml-2': outline(),
      }"
    >
      <app-checkbox
        variant="primary"
        [(checked)]="checkboxValue"
        [disabled]="disable()"
        [outline]="outline()"
        [size]="size()"
        display="inline-flex"
        class="size-10"
      ></app-checkbox>
    </div>
  </div>
</div>
